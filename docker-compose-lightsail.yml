services:
  wishlist:
    image: wishlist:latest
    container_name: wishlist
    restart: unless-stopped
    volumes:
      - ./data/wishlist-items.json:/app/data/wishlist-items.json
      - ./data/users.json:/app/data/users.json
      - ./data/feature-requests.json:/app/data/feature-requests.json
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    networks:
      - edge-wishlist

networks:
  # This app's own edge network — only apps-home's Caddy joins it (see apps-home CLAUDE.md
  # "Network isolation"); not the shared iqe-proxy-net, where any other app could reach it.
  edge-wishlist:
    name: edge-wishlist
    external: true
